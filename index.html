<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Choice ESC – Vote</title>
<style>
  :root{
    --paper:#EDF0FF; --surface:#FFFFFF; --ink:#11133D; --soft:#5A5E8C; --line:#11133D;
    --cobalt:#2E46FF; --cobalt-soft:#DDE2FF; --sun:#FFD23F; --pink:#FF6FA0; --mint:#3DDC97;
    --danger:#E5384F;
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--cobalt-soft) 1.2px, transparent 1.3px);background-size:22px 22px;min-height:100vh}
  .wrap{max-width:700px;margin:0 auto;padding:22px 16px 80px}
  :focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:disabled{opacity:.5;cursor:default}

  /* Brand bar */
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .brand-mark{width:34px;height:34px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:18px;transform:rotate(-8deg)}
  .brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}

  /* Hero */
  .hero{margin:0 0 22px}
  .hero h1{font-size:clamp(40px,11vw,64px);line-height:.95;margin:0;font-weight:800;letter-spacing:-.04em;font-stretch:90%}
  .hero p{margin:10px 0 0;font-size:17px;color:var(--soft)}
  .hero .actions{margin-top:18px}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:16px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s, box-shadow .08s}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn-sun{background:var(--sun)}
  .btn-cobalt{background:var(--cobalt);color:#fff}
  .btn-white{background:var(--surface)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-block{width:100%}
  .link{font-weight:600;color:var(--soft);padding:6px 0;font-size:15px}
  .link:hover{color:var(--ink)}
  .back{margin-bottom:14px;display:inline-block}

  /* Panels */
  .panel{background:var(--surface);border:2.5px solid var(--ink);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:5px 5px 0 var(--ink)}
  .panel.flat{box-shadow:none;border-width:2px}
  h2{font-size:28px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.03em}
  h3{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .soft{color:var(--soft)} .small{font-size:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}

  /* Survey tickets */
  .ticket{display:flex;align-items:stretch;background:var(--surface);border:2.5px solid var(--ink);border-radius:20px;margin-bottom:14px;overflow:hidden;cursor:pointer;text-align:left;width:100%;transition:transform .12s, box-shadow .12s;box-shadow:4px 4px 0 var(--ink)}
  .ticket:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  .ticket .stripe{width:14px;flex:none;border-right:2.5px solid var(--ink)}
  .ticket .body{flex:1;padding:16px 18px;min-width:0}
  .ticket .meta{margin-top:6px;font-size:14px;color:var(--soft)}
  .ticket .num{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px;border-left:2.5px dashed var(--ink);min-width:92px}
  .ticket .num strong{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .ticket .num span{font-size:12px;color:var(--soft);margin-top:2px}

  .pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 11px;border-radius:999px;border:2px solid var(--ink)}
  .pill.open{background:var(--mint)}
  .pill.closed{background:var(--surface);color:var(--soft);border-color:var(--soft)}
  .pill.done{background:var(--mint)}
  .pill.todo{background:var(--sun)}

  /* Forms */
  input[type=text],textarea,select{font:inherit;font-size:16px;width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink);outline:none}
  input[type=text]:focus,textarea:focus,select:focus{box-shadow:0 0 0 4px var(--cobalt-soft);border-color:var(--cobalt)}
  input.title-input{font-size:26px;font-weight:800;letter-spacing:-.02em;border:none;border-bottom:2.5px solid var(--ink);border-radius:0;padding:6px 0;background:transparent}
  input.title-input:focus{box-shadow:none}
  textarea{resize:vertical;min-height:64px}
  label.field{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  .qcard{border:2px solid var(--ink);border-radius:18px;padding:16px;margin-top:16px;background:var(--paper)}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .qnum{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:14px}
  .typepick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .typepick button{padding:7px 13px;border-radius:999px;border:2px solid var(--ink);font-weight:600;font-size:14px;background:var(--surface)}
  .typepick button.on{background:var(--ink);color:#fff}
  .opt-row{display:flex;gap:8px;margin-top:8px;align-items:center}
  .opt-row .dot{width:18px;height:18px;border:2px solid var(--ink);border-radius:50%;flex:none;background:var(--surface)}
  .opt-row .dot.sq{border-radius:5px}
  .opt-row input{flex:1}
  .x{width:36px;height:36px;border-radius:50%;flex:none;font-size:18px;color:var(--soft)}
  .x:hover{background:var(--cobalt-soft);color:var(--ink)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px}
  .toggle input{accent-color:var(--cobalt);width:18px;height:18px}
  .addq{width:100%;margin-top:16px;padding:16px;border:2.5px dashed var(--ink);border-radius:18px;font-weight:700;font-size:16px;background:transparent}
  .addq:hover{background:var(--surface)}

  /* Answering */
  .qa{margin-bottom:16px}
  .qa h3{font-size:20px;margin-bottom:4px}
  .choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid var(--ink);border-radius:14px;margin-top:10px;cursor:pointer;background:var(--surface);font-size:16px;font-weight:500;transition:background .1s}
  .choice:hover{background:var(--paper)}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice .key{width:30px;height:30px;flex:none;border:2px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface)}
  .choice:has(input:checked){background:var(--sun);box-shadow:3px 3px 0 var(--ink)}
  .choice:has(input:checked) .key{background:var(--ink);color:var(--sun)}
  .choice:has(input:focus-visible){outline:3px solid var(--cobalt);outline-offset:2px}
  .req{color:var(--pink);font-weight:800}

  /* Results */
  .big{font-size:64px;font-weight:800;line-height:.9;letter-spacing:-.05em}
  .tabs{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;padding:3px;background:var(--surface);margin:6px 0 16px}
  .tabs button{padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px}
  .tabs button.on{background:var(--ink);color:#fff}
  .bar-row{margin-top:14px}
  .bar-label{display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:600;margin-bottom:6px}
  .bar-label .pct{font-weight:800}
  .bar{height:22px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--cobalt);border-right:2px solid var(--ink);animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  .bar > i.zero{border-right:none}
  .bar-row.top .bar > i{background:var(--sun)}
  @keyframes grow{from{width:0!important}}
  .bubble{background:var(--paper);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:10px 14px;margin-top:10px;font-size:15px}
  .bubble .who{font-weight:700;font-size:13px;color:var(--soft);display:block;margin-bottom:2px}
  .person{border-top:2px dashed var(--ink);padding:14px 0}
  .person:first-child{border-top:none;padding-top:0}
  .person dl{margin:8px 0 0;display:grid;gap:6px}
  .person dt{font-size:13px;color:var(--soft)}
  .person dd{margin:0;font-weight:600}
  .howto{background:var(--sun);border:2.5px solid var(--ink);border-radius:22px;padding:18px 20px;margin-bottom:16px}
  .howto ol{margin:8px 0 0;padding-left:20px} .howto li{margin-top:4px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .toolbar .btn{padding:9px 16px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
  .err{color:var(--danger);font-weight:600;font-size:15px;margin-top:10px}
  .empty{text-align:center;padding:34px 20px}
  .empty .btn{margin-top:14px}

  /* ESC points */
  .pts-hint{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 8px;font-size:15px}
  .tray{display:flex;flex-wrap:wrap;gap:7px;position:sticky;top:0;z-index:2;background:var(--surface);padding:10px 0 12px;border-bottom:2px dashed var(--ink);margin-bottom:6px}
  .chip{min-width:42px;height:42px;padding:0 8px;border-radius:12px;border:2.5px solid var(--ink);background:var(--surface);font-weight:800;font-size:17px}
  .chip.sel{background:var(--sun);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
  .chip.used{background:var(--ink);color:#fff;opacity:.35}
  .chip.used.sel{opacity:1}
  .crow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:2px solid var(--ink);border-radius:14px;margin-top:8px;background:var(--surface);font-size:16px;font-weight:600;text-align:left}
  .crow:hover:not(:disabled){background:var(--paper)}
  .crow .rn{width:24px;font-size:13px;color:var(--soft);font-weight:700;flex:none}
  .crow .fl{font-size:24px;line-height:1;flex:none}
  .crow .nm{flex:1;min-width:0}
  .crow .pv{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
  .crow.has{background:var(--cobalt-soft)}
  .crow.has .pv{background:var(--cobalt);color:#fff;border:2.5px solid var(--ink)}
  .crow.has.twelve .pv{background:var(--sun);color:var(--ink)}
  .crow:disabled{opacity:.45;border-style:dashed;cursor:default}
  .crow .tag{font-size:12px;font-weight:700;color:var(--soft)}
  .sb-row{display:grid;grid-template-columns:28px 30px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-top:2px solid var(--cobalt-soft)}
  .sb-row:first-of-type{border-top:none}
  .sb-row .rk{font-weight:800;color:var(--soft)}
  .sb-row .fl{font-size:22px}
  .sb-row .nm{font-weight:600;min-width:0}
  .sb-row .nm small{display:block;font-weight:500;color:var(--soft);font-size:12px}
  .sb-row .tot{font-weight:800;font-size:20px;min-width:44px;text-align:center;padding:4px 8px;border-radius:10px;border:2px solid var(--ink);background:var(--paper)}
  .sb-row.lead .tot{background:var(--sun)}
  .sb-bar{grid-column:2 / 5;height:6px;border-radius:99px;background:var(--paper);overflow:hidden}
  .sb-bar i{display:block;height:100%;background:var(--cobalt);animation:grow .7s cubic-bezier(.2,.8,.2,1) both}

  /* Thanks */
  .stamp{width:110px;height:110px;margin:4px auto 14px;border-radius:50%;background:var(--mint);border:3px solid var(--ink);display:grid;place-items:center;font-size:52px;font-weight:800;box-shadow:4px 4px 0 var(--ink);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes stamp{from{transform:scale(1.8) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
  @media (max-width:480px){ .panel{padding:16px} .ticket .num{min-width:76px;padding:0 12px} .ticket .num strong{font-size:28px} }
</style>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="brand-mark">♥</div><b>Second Choice ESC</b></div>
  <main id="app"><div class="panel flat soft">Loading…</div></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, signInAnonymously, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeOkFY7wQrN6U3Gj6PHfBsrhNWy1xOX0",
  authDomain: "second-choice-esc.firebaseapp.com",
  projectId: "second-choice-esc",
  storageBucket: "second-choice-esc.firebasestorage.app",
  messagingSenderId: "334955922985",
  appId: "1:334955922985:web:ae211c4e40dd88c337fe38"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

/* ---------- The two polls ---------- */
const POLLS = {
  sf1: { title:'Semi-Final 1', countries:["Romania","Czechia","Albania","Serbia","Portugal","Poland","France","Luxembourg","Moldova","Estonia","Greece","Lithuania","Italy","Denmark","Ukraine","Cyprus","Spain"], locked:["Albania","Poland"] },
  sf2: { title:'Semi-Final 2', countries:["Austria","Germany","Montenegro","Switzerland","Australia","Azerbaijan","Finland","United Kingdom","Croatia","Malta","San Marino","Latvia","Sweden","Armenia","Georgia","Norway","Bulgaria","Belgium"], locked:["Switzerland","Australia","Sweden"] }
};
const POINTS = [12,10,8,7,6,5,4,3,2,1];
const ISO = {Romania:'RO',Czechia:'CZ',Albania:'AL',Serbia:'RS',Portugal:'PT',Poland:'PL',France:'FR',Luxembourg:'LU',Moldova:'MD',Estonia:'EE',Greece:'GR',Lithuania:'LT',Italy:'IT',Denmark:'DK',Ukraine:'UA',Cyprus:'CY',Spain:'ES',Austria:'AT',Germany:'DE',Montenegro:'ME',Switzerland:'CH',Australia:'AU',Azerbaijan:'AZ',Finland:'FI','United Kingdom':'GB',Croatia:'HR',Malta:'MT','San Marino':'SM',Latvia:'LV',Sweden:'SE',Armenia:'AM',Georgia:'GE',Norway:'NO',Bulgaria:'BG',Belgium:'BE'};
const STRIPES = ['var(--cobalt)','var(--pink)'];
function flag(c){ const k=ISO[c]; return k ? String.fromCodePoint(...[...k].map(ch=>0x1F1E6+ch.charCodeAt(0)-65)) : '🏳️'; }
function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

const app = document.getElementById('app');
const S = { user:null, ready:false, view:'home', poll:null, slots:null, sel:0, myVotes:{}, sending:false,
  admin:false, votes:[], adminTab:'sf1', adminSub:'board', unsub:null, adminErr:null, confirmDel:null };

/* ---------- Routing ---------- */
function route(){
  const h = location.hash.replace('#','');
  S.confirmDel = null;
  if(h==='admin'){ S.view='admin'; }
  else if(POLLS[h]){ S.view='vote'; S.poll=h; S.slots=null; }
  else { S.view='home'; S.poll=null; }
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
function go(h){ if(location.hash==='#'+h) route(); else location.hash = h; }

/* ---------- Auth ---------- */
onAuthStateChanged(auth, async user=>{
  S.user = user;
  if(!user){ try{ await signInAnonymously(auth); }catch(e){ S.authErr = e.code || 'auth'; S.ready = true; render(); } return; }
  S.ready = true;
  S.admin = !user.isAnonymous;
  await loadMyVotes();
  if(S.admin) startAdmin(); else stopAdmin();
  route();
});

async function loadMyVotes(){
  S.myVotes = {};
  if(!S.user) return;
  for(const p of Object.keys(POLLS)){
    try{ const d = await getDoc(doc(db,'votes',p+'_'+S.user.uid)); if(d.exists()) S.myVotes[p] = d.data(); }catch(e){}
  }
}

/* ---------- Render ---------- */
function render(){
  if(S.authErr){ app.innerHTML = `<div class="panel empty"><h2>Can’t connect</h2><p class="soft">The voting service isn’t reachable right now. Check your connection and reload the page.</p></div>`; return; }
  if(!S.ready){ app.innerHTML = `<div class="panel flat soft">Loading…</div>`; return; }
  if(S.view==='admin') return renderAdmin();
  if(S.view==='vote') return renderVote();
  return renderHome();
}

function renderHome(){
  app.innerHTML = `
    <section class="hero"><h1>Give your points.</h1>
      <p>Pick a semi-final and hand out 12, 10 and 8 to 1 points. Every country can get points from you only once.</p></section>
    ${Object.entries(POLLS).map(([k,p],i)=>`
      <button class="ticket" data-p="${k}">
        <span class="stripe" style="background:${STRIPES[i]}"></span>
        <span class="body"><h3>${p.title}</h3><span class="meta">${p.countries.length-p.locked.length} countries to vote for</span></span>
        <span class="num" style="min-width:auto">${S.myVotes[k]?'<span class="pill done">✓ Voted</span>':'<span class="pill todo">Vote</span>'}</span>
      </button>`).join('')}`;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
}

/* ----- Voting ----- */
function renderVote(){
  const p = POLLS[S.poll], mine = S.myVotes[S.poll];
  const back = `<button class="link back" id="back">← Both semi-finals</button>`;
  if(mine && !S.editing){
    app.innerHTML = back + `<div class="panel empty"><div class="stamp">✓</div><h2>Points sent!</h2>
      <p class="soft">Your votes for ${p.title} are in. Your 12 points went to ${flag(mine.points[0])} ${esc(mine.points[0])}.</p>
      <button class="btn btn-white" id="edit">Change my points</button></div>`;
    document.getElementById('back').onclick = ()=>go('');
    document.getElementById('edit').onclick = ()=>{ S.editing=true; S.slots=null; render(); };
    return;
  }
  if(!S.slots){ S.slots = POINTS.map((_,k)=> (mine && mine.points[k]) || null); S.sel = S.slots.findIndex(x=>!x); }
  app.innerHTML = back + `
    <section class="hero"><h1 style="font-size:clamp(34px,9vw,52px)">${p.title}</h1>
      <p>${p.locked.join(', ').replace(/, ([^,]*)$/,' and $1')} ${p.locked.length===1?'is':'are'} already in the final.</p></section>
    <div class="panel qa">
      <label class="field" for="name" style="margin-top:0">Your name</label>
      <input type="text" id="name" maxlength="40" placeholder="So the host knows who voted" value="${esc(store('scesc-name')||'')}">
    </div>
    <div class="panel qa"><div id="pts"></div></div>
    <div id="err" class="err"></div>
    <button class="btn btn-cobalt btn-block" id="send" style="margin-top:6px">Send my points</button>`;
  document.getElementById('back').onclick = ()=>{ S.editing=false; go(''); };
  document.getElementById('name').oninput = e=>store('scesc-name', e.target.value);
  document.getElementById('send').onclick = sendVote;
  drawPoints();
}

function drawPoints(){
  const p = POLLS[S.poll], box = document.getElementById('pts'); if(!box) return;
  const given = S.slots.filter(Boolean).length, slotOf = c=>S.slots.indexOf(c);
  box.innerHTML = `
    <div class="tray" role="group" aria-label="Points">${POINTS.map((pt,k)=>`<button class="chip ${S.slots[k]?'used':''} ${S.sel===k?'sel':''}" data-k="${k}" aria-pressed="${S.sel===k}">${pt}</button>`).join('')}</div>
    <div class="pts-hint"><span class="soft">${S.sel>=0 ? `Tap the country that gets <b style="color:var(--ink)">${POINTS[S.sel]} ${POINTS[S.sel]===1?'point':'points'}</b>.` : 'All points given. Tap a country to take its points back.'}</span><b>${given}/10</b></div>
    ${p.countries.map((c,j)=>{ const lk = p.locked.includes(c), k = slotOf(c);
      return `<button class="crow ${k>=0?'has':''} ${k===0?'twelve':''}" data-c="${esc(c)}" ${lk?'disabled':''}>
        <span class="rn">${String(j+1).padStart(2,'0')}</span><span class="fl">${flag(c)}</span>
        <span class="nm">${esc(c)}${lk?'<br><span class="tag">Already in the final</span>':''}</span>
        <span class="pv">${k>=0?POINTS[k]:''}</span></button>`; }).join('')}`;
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(S.slots[k]) S.slots[k]=null; S.sel=k; drawPoints(); });
  box.querySelectorAll('.crow').forEach(b=>b.onclick=()=>{ const c=b.dataset.c, k=slotOf(c);
    if(k>=0){ S.slots[k]=null; S.sel=k; } else if(S.sel>=0){ S.slots[S.sel]=c; S.sel=S.slots.findIndex(x=>!x); }
    drawPoints(); });
}

async function sendVote(){
  const err = document.getElementById('err'), btn = document.getElementById('send');
  const name = (document.getElementById('name').value||'').trim();
  if(!name){ err.textContent = 'Enter your name first.'; document.getElementById('name').focus(); return; }
  const missing = POINTS.filter((_,k)=>!S.slots[k]);
  if(missing.length){ err.textContent = `You still have ${missing.join(', ')} ${missing.length===1&&missing[0]===1?'point':'points'} to give.`; return; }
  if(!S.user){ err.textContent = 'Not connected yet. Wait a second and try again.'; return; }
  btn.disabled = true; btn.textContent = 'Sending…'; err.textContent='';
  const data = { poll:S.poll, uid:S.user.uid, name, points:[...S.slots], at:serverTimestamp() };
  try{
    await setDoc(doc(db,'votes',S.poll+'_'+S.user.uid), data);
    S.myVotes[S.poll] = data; S.editing=false; S.slots=null; render(); window.scrollTo(0,0);
  }catch(e){
    btn.disabled=false; btn.textContent='Send my points';
    err.textContent = e.code==='permission-denied' ? 'Your points couldn’t be saved. Voting may be closed.' : 'Couldn’t send your points. Check your connection and try again.';
  }
}

/* ----- Admin ----- */
function startAdmin(){
  if(S.unsub) return;
  S.unsub = onSnapshot(collection(db,'votes'), snap=>{
    S.votes = snap.docs.map(d=>({id:d.id, ...d.data()})); S.adminErr=null;
    if(S.view==='admin') render();
  }, e=>{ S.adminErr = e.code||'error'; S.unsub=null; if(S.view==='admin') render(); });
}
function stopAdmin(){ if(S.unsub){ S.unsub(); S.unsub=null; } S.votes=[]; }

function renderAdmin(){
  const back = `<button class="link back" id="back">← Voting page</button>`;
  if(!S.admin){
    app.innerHTML = back + `<div class="panel"><h2>Host login</h2><p class="soft">Only the host can see the results.</p>
      <label class="field" for="em">Email</label><input type="text" id="em" autocomplete="username" inputmode="email">
      <label class="field" for="pw">Password</label><input type="text" id="pw" autocomplete="current-password" style="-webkit-text-security:disc">
      <div id="lerr" class="err"></div>
      <button class="btn btn-cobalt btn-block" id="login" style="margin-top:14px">Log in</button></div>`;
    document.getElementById('back').onclick = ()=>go('');
    document.getElementById('login').onclick = async ()=>{
      const b=document.getElementById('login'), le=document.getElementById('lerr');
      b.disabled=true; b.textContent='Logging in…';
      try{ await signInWithEmailAndPassword(auth, document.getElementById('em').value.trim(), document.getElementById('pw').value); }
      catch(e){ b.disabled=false; b.textContent='Log in'; le.textContent='Email or password is wrong.'; }
    };
    return;
  }
  if(S.adminErr){
    app.innerHTML = back + `<div class="panel empty"><h2>No access to the results</h2><p class="soft">You’re logged in, but the database doesn’t list this account as the host. Check the email in the database rules.</p><button class="btn btn-white" id="out">Log out</button></div>`;
    document.getElementById('back').onclick = ()=>go('');
    document.getElementById('out').onclick = ()=>signOut(auth);
    return;
  }
  const t = S.adminTab, p = POLLS[t];
  const vs = S.votes.filter(v=>v.poll===t && Array.isArray(v.points)).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0));
  const tot={}, tw={}; p.countries.filter(c=>!p.locked.includes(c)).forEach(c=>{tot[c]=0;tw[c]=0;});
  vs.forEach(v=>v.points.forEach((c,k)=>{ if(c in tot){ tot[c]+=POINTS[k]; if(k===0) tw[c]++; } }));
  const order = Object.keys(tot).sort((a,b)=>tot[b]-tot[a] || tw[b]-tw[a] || p.countries.indexOf(a)-p.countries.indexOf(b));
  const max = Math.max(1,...Object.values(tot));
  let rank=0,last=null;
  const board = order.map((c,i)=>{ if(tot[c]!==last){rank=i+1;last=tot[c];}
    return `<div class="sb-row ${i===0&&tot[c]>0?'lead':''}"><span class="rk">${rank}</span><span class="fl">${flag(c)}</span>
      <span class="nm">${esc(c)}${tw[c]?`<small>${tw[c]}× 12 points</small>`:''}</span><span class="tot">${tot[c]}</span>
      <span class="sb-bar"><i style="width:${tot[c]/max*100}%"></i></span></div>`; }).join('');
  const people = vs.length ? vs.map(v=>`<div class="person"><div class="spread"><h3>${esc(v.name)}</h3>
      ${S.confirmDel===v.id?`<span class="row"><button class="btn btn-danger" data-delyes="${esc(v.id)}" style="padding:6px 12px;font-size:13px">Delete</button><button class="link" data-delno>Cancel</button></span>`:`<button class="link" data-del="${esc(v.id)}" style="font-size:13px">Remove vote</button>`}</div>
      <dl>${v.points.map((c,k)=>`<div style="display:flex;gap:10px"><dt style="min-width:24px;font-weight:800;color:var(--ink)">${POINTS[k]}</dt><dd>${flag(c)} ${esc(c)}</dd></div>`).join('')}</dl></div>`).join('')
    : '<p class="soft" style="margin:0">Nobody has voted in this semi-final yet.</p>';
  app.innerHTML = back + `
    <div class="spread" style="margin-bottom:6px"><h2>Results</h2><button class="link" id="out">Log out</button></div>
    <div class="tabs">${Object.entries(POLLS).map(([k,x])=>`<button data-t="${k}" class="${t===k?'on':''}">${x.title}</button>`).join('')}</div>
    <div class="panel"><div class="spread"><div><h2>${p.title}</h2><p class="soft" style="margin:6px 0 0">Updates live as votes come in.</p></div>
      <div style="text-align:right;flex:none"><div class="big">${vs.length}</div><div class="small soft">${vs.length===1?'voter':'voters'}</div></div></div></div>
    <div class="tabs"><button data-s="board" class="${S.adminSub==='board'?'on':''}">Scoreboard</button><button data-s="people" class="${S.adminSub==='people'?'on':''}">Who voted what</button></div>
    <div class="panel">${S.adminSub==='board'?board:people}</div>`;
  document.getElementById('back').onclick = ()=>go('');
  document.getElementById('out').onclick = ()=>signOut(auth);
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ S.adminTab=b.dataset.t; S.confirmDel=null; render(); });
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.adminSub=b.dataset.s; render(); });
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ S.confirmDel=b.dataset.del; render(); });
  app.querySelectorAll('[data-delno]').forEach(b=>b.onclick=()=>{ S.confirmDel=null; render(); });
  app.querySelectorAll('[data-delyes]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await deleteDoc(doc(db,'votes',b.dataset.delyes)); }catch(e){} S.confirmDel=null; render(); });
}
render();
</script>
</body>
